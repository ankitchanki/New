A4AABE">navigation settings; StashDrop cannot unlock eligibility.</text><text x="38" y="692" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#B4C9FF" font-weight="500">Choose Google assistant</text><text x="38" y="730" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#B4C9FF" font-weight="500">Try Google search</text><rect x="22" y="770" width="346" height="76" rx="20" fill="#171B26" /><path transform="translate(38 795) scale(1.08333)" d="M5 21V4h11l-1.5 4L16 12H5" fill="none" stroke="#B4C9FF" stroke-width="1.66154" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="803" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#F1F3FA" font-weight="500">Digital assistant</text><text x="80" y="822" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">StashDrop selected</text><path transform="translate(334 798) scale(0.833333)" d="M9.5 6l6 6-6 6" fill="none" stroke="#B4C9FF" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="858" width="346" height="150" rx="20" fill="#171B26" /><text x="38" y="886" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">Assistant gestures and Google&#x27;s voice service are</text><text x="38" y="903" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">separate settings. Google decides native search</text><text x="38" y="920" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">eligibility.</text><text x="38" y="955" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#B4C9FF" font-weight="500">Open assistant picker</text><text x="38" y="993" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-