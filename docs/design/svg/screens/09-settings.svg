<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><title>StashDrop · Settings</title><defs><clipPath id="09-settings-clip1"><rect x="0" y="0" width="390" height="844" rx="36"/></clipPath><linearGradient id="09-settings-lg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C0E15" stop-opacity="0"/><stop offset="0.3" stop-color="#0C0E15" stop-opacity="1"/><stop offset="1" stop-color="#0C0E15" stop-opacity="1"/></linearGradient><filter id="09-settings-sh3" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/></filter></defs><g clip-path="url(#09-settings-clip1)"><rect x="0" y="0" width="390" height="844" fill="#0C0E15" /><text x="22" y="70" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#F1F3FA" font-weight="700" letter-spacing="2">MAKE IT YOURS</text><text x="22" y="120" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#F1F3FA" font-weight="700" letter-spacing="-0.6">Settings.</text><text x="22" y="146" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#A4AABE">Choose the access you need.</text><text x="22" y="186" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#F1F3FA" font-weight="500">Setup</text><text x="68.32" y="186" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE" font-weight="500"> ·  Tap to review</text><rect x="22" y="202" width="346" height="68" rx="20" fill="#171B26" /><path transform="translate(38 225) scale(0.916667)" d="M8 13a4 4 0 1 1 0 .01M16.5 7.5a2.5 2.5 0 1 1 0 .01M16 17a2 2 0 1 1 0 .01" fill="none" stroke="#B4C9FF" stroke-width="1.96364" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="232" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#F1F3FA">Edge shelf</text><text x="72" y="250" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">Not enabled</text><text x="344" y="241" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#B4C9FF" font-weight="500" text-anchor="end">Allow</text><rect x="22" y="282" width="346" height="68" rx="20" fill="#171B26" /><path transform="translate(38 305) scale(0.916667)" d="M6 17V11a6 6 0 0 1 12 0v6l1.5 1.5h-15zM10 20.5h4" fill="none" stroke="#9DE3CF" stroke-width="1.96364" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="312" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#F1F3FA">Notifications</text><text x="72" y="330" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#9DE3CF">On</text><path transform="translate(330 304) scale(1)" d="M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18zM8 12.2l2.7 2.7L16.2 9.4" fill="none" stroke="#9DE3CF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="362" width="346" height="68" rx="20" fill="#171B26" /><path transform="translate(38 385) scale(0.916667)" d="M12 9.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM12 3v6.5M12 14.5V21M4.2 7.5l5.6 3.2M14.2 13.3l5.6 3.2M4.2 16.5l5.6-3.2M14.2 10.7l5.6-3.2" fill="none" stroke="#B4C9FF" stroke-width="1.96364" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="392" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#F1F3FA">Shizuku</text><text x="72" y="410" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">Shizuku is not running</text><text x="344" y="401" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#B4C9FF" font-weight="500" text-anchor="end">Connect</text><text x="22" y="454" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#F1F3FA" font-weight="500">Search &amp; assistant</text><text x="163.84" y="454" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE" font-weight="500"> ·  Google only</text><rect x="22" y="470" width="346" height="232" rx="20" fill="#171B26" /><text x="38" y="498" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#F1F3FA" font-weight="500">Google Circle to Search</text><text x="38" y="518" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">Google voice service active · eligibility varies</text><text x="38" y="550" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">All search buttons and gestures request Google&#x27;s</text><text x="38" y="567" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">interface. Google may show Gemini on unsupported</text><text x="38" y="584" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">devices. Enable Circle to Search in your phone&#x27;s</text><text x="38" y="601" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">navigation settings; StashDrop cannot unlock eligibility.</text><text x="38" y="636" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#B4C9FF" font-weight="500">Choose Google assistant</text><text x="38" y="674" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#B4C9FF" font-weight="500">Try Google search</text><rect x="22" y="714" width="346" height="76" rx="20" fill="#171B26" /><path transform="translate(38 739) scale(1.08333)" d="M5 21V4h11l-1.5 4L16 12H5" fill="none" stroke="#B4C9FF" stroke-width="1.66154" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="747" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#F1F3FA" font-weight="500">Digital assistant</text><text x="80" y="766" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">System picker and optional Shizuku</text><path transform="translate(334 742) scale(0.833333)" d="M9.5 6l6 6-6 6" fill="none" stroke="#B4C9FF" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="802" width="346" height="76" rx="20" fill="#171B26" /><path transform="translate(38 827) scale(1.08333)" d="M4 7h9M17 7h3M15 5v4M4 12h3M11 12h9M9 10v4M4 17h11M19 17h1M17 15v4" fill="none" stroke="#B4C9FF" stroke-width="1.66154" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="835" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#F1F3FA" font-weight="500">Gestures, clipboard &amp; feel</text><text x="80" y="854" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">Customize interactions and motion</text><path transform="translate(334 830) scale(0.833333)" d="M9.5 6l6 6-6 6" fill="none" stroke="#B4C9FF" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="740" width="390" height="104" fill="url(#09-settings-lg2)" /><rect x="24" y="760" width="342" height="72" rx="36" fill="#242A39" filter="url(#09-settings-sh3)"/><path transform="translate(69 774) scale(1)" d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z" fill="none" stroke="#A4AABE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="81" y="820" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE" font-weight="500" text-anchor="middle">Home</text><path transform="translate(183 774) scale(1)" d="M12 3 3 8l9 5 9-5-9-5zM3 12.5l9 5 9-5M3 16.5l9 5 9-5" fi