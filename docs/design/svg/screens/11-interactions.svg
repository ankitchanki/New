<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img"><title>StashDrop · Interactions</title><defs><clipPath id="11-interactions-clip1"><rect x="0" y="0" width="390" height="844" rx="36"/></clipPath><linearGradient id="11-interactions-lg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C0E15" stop-opacity="0"/><stop offset="0.3" stop-color="#0C0E15" stop-opacity="1"/><stop offset="1" stop-color="#0C0E15" stop-opacity="1"/></linearGradient><filter id="11-interactions-sh3" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/></filter></defs><g clip-path="url(#11-interactions-clip1)"><rect x="0" y="0" width="390" height="844" fill="#0C0E15" /><path transform="translate(22 54) scale(1)" d="M19 12H5M11 6l-6 6 6 6" fill="none" stroke="#F1F3FA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="70" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#F1F3FA" font-weight="700" letter-spacing="2">INTERACTIONS</text><text x="22" y="120" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="28" fill="#F1F3FA" font-weight="700" letter-spacing="-0.6">Your way.</text><text x="22" y="146" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#A4AABE">One search strip. One movable edge shelf.</text><rect x="22" y="166" width="346" height="76" rx="20" fill="#171B26" /><text x="38" y="198" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#F1F3FA">Gesture strip</text><text x="38" y="217" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">Swipe up above the bottom navigation bar.</text><text x="38" y="233.56" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">No persistent markers.</text><rect x="302" y="188" width="52" height="32" rx="16" fill="#B4C9FF" /><circle cx="338" cy="204" r="12" fill="#15223E" /><path d="M332 204 l4 4 l8 -8" fill="none" stroke="#B4C9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="22" y="254" width="346" height="76" rx="20" fill="#171B26" /><path transform="translate(38 279) scale(1.08333)" d="M5 21V4h11l-1.5 4L16 12H5" fill="none" stroke="#B4C9FF" stroke-width="1.66154" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="287" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#F1F3FA" font-weight="500">System corner swipe</text><text x="80" y="306" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">Enable Google&#x27;s assistant corner gesture in…</text><path transform="translate(334 282) scale(0.833333)" d="M9.5 6l6 6-6 6" fill="none" stroke="#B4C9FF" stroke-width="2.16" stroke-linecap="round" stroke-linejoin="round"/><text x="22" y="352" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">Android handles physical corner swipes. Availability and</text><text x="22" y="369" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">Google search eligibility depend on your phone. Drag the shelf</text><text x="22" y="386" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">handle to either edge; its position is remembered.</text><rect x="22" y="407" width="346" height="76" rx="20" fill="#171B26" /><text x="38" y="439" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#F1F3FA">Auto-stash copied text</text><text x="38" y="458" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">May retain passwords, codes or private</text><text x="38" y="474.56" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">text</text><rect x="302" y="429" width="52" height="32" rx="16" fill="#B4C9FF" /><circle cx="338" cy="445" r="12" fill="#15223E" /><path d="M332 445 l4 4 l8 -8" fill="none" stroke="#B4C9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="22" y="497" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#9DE3CF">Watching the clipboard while the edge shelf runs</text><rect x="22" y="513" width="346" height="76" rx="20" fill="#171B26" /><text x="38" y="545" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#F1F3FA">Haptic feedback</text><text x="38" y="564" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#A4AABE">Feel drags, stacks and circles</text><rect x="302" y="535" width="52" height="32" rx="16" fill="#B4C9FF" /><circle cx="338" cy="551" r="12" fill="#15223E" /><path d="M332 551 l4 4 l8 -8" fill="none" stroke="#B4C9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="22" y="601" width="346" height="92" rx="20" fill="#171B26" /><text x="38" y="631" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#F1F3FA">Springiness</text><text x="352" y="631" font-family="Roboto, 'Google Sans', Inter, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#B4C9FF" text-anchor="end">1.0×</text><rect x="38" y="659" width="314" height="4" rx="2" fill="#3A4256" /><rect x="38" y="659" width="157" height="4" rx="2" fill="#B4C9FF" /><rect x="193" y="647" width="4" height="28" rx="2" fill="#B4C9FF" /><rect x="0" y="740" width="390" height="104" fill="url(#11-interactions-lg2)" /><rect x="24" y="760" width="342" height="72" rx="36" fill="#242A39" filter="url(#11-interactions-sh3)"/><path transform="translate(69 774) scale(1)" d="M4 10.5 