name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run checks
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:verifyPaparazziDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StashDrop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports/

  release:
    # Signed builds run for version tags, or manually. Configure the repository secrets
    # listed in docs/RELEASING.md first; the build refuses to produce an unsigned release.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.STASHDROP_KEYSTORE_BASE64 }}
      STASHDROP_RELEASE_KEY_ALIAS: ${{ secrets.STASHDROP_RELEASE_KEY_ALIAS }}
      STASHDROP_RELEASE_STORE_PASSWORD: ${{ secrets.STASHDROP_RELEASE_STORE_PASSWORD }}
      STASHDROP_RELEASE_KEY_PASSWORD: ${{ secrets.STASHDROP_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret STASHDROP_KEYSTORE_BASE64 is not set. See docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "STASHDROP_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build signed APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease
      - name: Collect release assets
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/StashDrop-v$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/StashDrop-v$VERSION.aab"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "dist/StashDrop-v$VERSION.apk"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: StashDrop-release
          path: dist/
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/releases/$TAG.md"
          if [ -f "$NOTES" ]; then NOTES_ARG=(--notes-file "$NOTES"); else NOTES_ARG=(--generate-notes); fi
          gh release create "$TAG" dist/* --verify-tag --title "StashDrop ${TAG#v}" "${NOTES_ARG[@]}"
