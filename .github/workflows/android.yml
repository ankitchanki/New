name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to publish, e.g. v0.2.0 (created on this commit if missing; leave empty for artifacts only)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          # The default package list includes the retired "tools" package, which current sdkmanager rejects.
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Build debug APK and run checks
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:verifyPaparazziDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: StashDrop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: app/build/reports/

  release:
    # Signed builds run for version tags, or manually. Configure the repository secrets
    # listed in docs/RELEASING.md first; the build refuses to produce an unsigned release.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
      KEYSTORE_BASE64: ${{ secrets.STASHDROP_KEYSTORE_BASE64 }}
      STASHDROP_RELEASE_KEY_ALIAS: ${{ secrets.STASHDROP_RELEASE_KEY_ALIAS }}
      STASHDROP_RELEASE_STORE_PASSWORD: ${{ secrets.STASHDROP_RELEASE_STORE_PASSWORD }}
      STASHDROP_RELEASE_KEY_PASSWORD: ${{ secrets.STASHDROP_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          # The default package list includes the retired "tools" package, which current sdkmanager rejects.
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Check version and release notes
        run: |
          TAG=""
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$REQUESTED_RELEASE_TAG" ]]; then
            TAG="$REQUESTED_RELEASE_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          fi
          # An existing tag is rebuilt as tagged; a missing one is created on the dispatched commit at publication.
          if [[ -n "$TAG" ]] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "refs/tags/$TAG"
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          fi
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [[ -n "$TAG" && ( ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$TAG" != "v$VERSION" ) ]]; then
            echo "::error::The version tag must match versionName."
            exit 1
          fi
          test -f "docs/releases/v$VERSION.md"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Restore signing keystore
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          required = ["KEYSTORE_BASE64", "STASHDROP_RELEASE_KEY_ALIAS", "STASHDROP_RELEASE_STORE_PASSWORD", "STASHDROP_RELEASE_KEY_PASSWORD"]
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing signing secret names: " + ", ".join(missing) + ". See docs/RELEASING.md.")
          private = Path(os.environ["RUNNER_TEMP"]) / "stashdrop-signing"
          private.mkdir(mode=0o700)
          key = private / "release.p12"
          key.touch(mode=0o600)
          key.write_bytes(base64.b64decode(os.environ["KEYSTORE_BASE64"], validate=True))
          config = private / "release-signing.json"
          config.touch(mode=0o600)
          config.write_text(json.dumps({"storeFile": str(key), "keyAlias": os.environ["STASHDROP_RELEASE_KEY_ALIAS"], "storePassword": os.environ["STASHDROP_RELEASE_STORE_PASSWORD"], "keyPassword": os.environ["STASHDROP_RELEASE_KEY_PASSWORD"]}))
          PY
      - name: Build signed APK and AAB and run checks
        run: python scripts/build-release.py --credentials "$RUNNER_TEMP/stashdrop-signing/release-signing.json" --verify
      - name: Verify and collect public release assets
        run: |
          python scripts/prepare-release.py --credentials "$RUNNER_TEMP/stashdrop-signing/release-signing.json" --output dist --version "$RELEASE_VERSION"
      - name: Remove private signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/stashdrop-signing"
      - uses: actions/upload-artifact@v4
        with:
          name: StashDrop-release
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$RELEASE_TAG"
          NOTES="docs/releases/$TAG.md"
          if [ -f "$NOTES" ]; then NOTES_ARG=(--notes-file "$NOTES"); else NOTES_ARG=(--generate-notes); fi
          if [ "$TAG_EXISTS" = "true" ]; then TAG_ARG=(--verify-tag); else TAG_ARG=(--target "$RELEASE_SHA"); fi
          gh release create "$TAG" dist/* "${TAG_ARG[@]}" --latest --title "StashDrop ${TAG#v}" "${NOTES_ARG[@]}"
